name: CI

# Runs on Windows because the server targets Windows only (CLAUDE.md). The repo
# has no runnable test suite yet, so this checks that the requirements install
# on the target platform and every module compiles. No `paths` filter, so the
# check always reports under branch protection.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile base.py server.py windows_com.py demo_test.py
